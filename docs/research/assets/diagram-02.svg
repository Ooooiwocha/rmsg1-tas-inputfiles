<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="clocktitle clockdesc"><title id="clocktitle">入力によって進み方を分けられる二つの時計</title><desc id="clockdesc">Y保持では点滅が減る。YとSelectの交互入力では点滅20を保持する。どちらでもタイマーは進む。これは六更新の対照実験の概念図。</desc><rect width="800" height="340" rx="18" fill="#eef4f4"></rect><text x="38" y="44" font-size="22" fill="#172e3d">6更新の同一開始状態による対照</text><text x="38" y="110" font-size="22" fill="#172e3d">Yを保持</text><text x="275" y="110" font-size="21" fill="#172e3d">点滅 20 → 15</text><text x="550" y="110" font-size="21" fill="#136863">タイマー +6</text><text x="38" y="190" font-size="22" fill="#172e3d">Y ↔ Select</text><text x="275" y="190" font-size="21" fill="#136863">点滅 20 → 20</text><text x="550" y="190" font-size="21" fill="#136863">タイマー +6</text><path d="M45 235 H755" stroke="#a8bdbc"></path><text x="38" y="285" font-size="21" fill="#172e3d">表示側の待ちを保ち、命令位置に関わる時計を進める</text></svg>