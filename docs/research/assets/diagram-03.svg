<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="causetitle causedesc"><title id="causetitle">入力履歴から命令位置までの確認した因果</title><desc id="causedesc">YとSelectの交互入力で点滅描画状態をゼロに保ち、A決定後のカーソル描画処理を省略し、その区間のタイマー二更新がなくなり、次の命令位置が変わる。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#136863"></path></marker></defs><rect width="800" height="490" rx="18" fill="#eef4f4"></rect><g fill="white" stroke="#afc1c0"><rect x="90" y="25" width="620" height="65" rx="10"></rect><rect x="90" y="120" width="620" height="65" rx="10"></rect><rect x="90" y="215" width="620" height="65" rx="10"></rect><rect x="90" y="310" width="620" height="65" rx="10"></rect><rect x="90" y="405" width="620" height="60" rx="10"></rect></g><g text-anchor="middle" font-size="21" fill="#172e3d"><text x="400" y="65">Y/Select交互で未処理入力を毎回生成</text><text x="400" y="160">点滅減算を迂回し、描画状態を0に保つ</text><text x="400" y="255">同じA7312でも、決定後のカーソル描画処理を省略</text><text x="400" y="350">その区間のタイマー2更新が起こらない</text><text x="400" y="443">命令位置が $1BF223 から $1BF423 へ</text></g><g stroke="#136863" stroke-width="2" marker-end="url(#arr)"><path d="M400 90 V117"></path><path d="M400 185 V212"></path><path d="M400 280 V307"></path><path d="M400 375 V402"></path></g></svg>