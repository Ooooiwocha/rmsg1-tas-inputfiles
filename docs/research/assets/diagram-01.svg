<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="memtitle memdesc"><title id="memtitle">同じメモリに二つの役割が重なる</title><desc id="memdesc">12F0は点滅カウンターと親イベントの終了位置の上位バイト。12F5と12F6はタイマーと子イベントの命令ポインターの上位とバンクに重なる。</desc><rect width="800" height="380" rx="18" fill="#eef4f4"></rect><text x="40" y="45" font-size="22" fill="#172e3d">同じバイトを、別の処理が別の意味で使う</text><rect x="40" y="80" width="720" height="110" rx="10" fill="white" stroke="#abbebe"></rect><text x="65" y="118" font-size="22" fill="#172e3d">$12F0</text><text x="235" y="118" font-size="21" fill="#136863">選択カーソルの点滅カウンター</text><text x="235" y="159" font-size="21" fill="#5b426b">親のslot 10の終了位置の上位バイト</text><rect x="40" y="210" width="720" height="125" rx="10" fill="white" stroke="#abbebe"></rect><text x="65" y="250" font-size="22" fill="#172e3d">$12F5/6</text><text x="235" y="250" font-size="21" fill="#136863">NMI中に更新されるタイマー</text><text x="235" y="291" font-size="21" fill="#5b426b">slot 11の命令ポインター上位・バンク</text></svg>